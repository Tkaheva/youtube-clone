services:
  postgres:
    image: postgres:15-alpine
    container_name: youtude-postgres
    environment:
      POSTGRES_USER: youtude
      POSTGRES_PASSWORD: youtude
      POSTGRES_DB: youtude
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youtude -d youtude"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Совместимый форк MinIO
    image: pgsty/silo:latest
    container_name: youtude-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Разрешаем CORS-запросы из браузера (для просмотра видео)
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  youtude:
    build: .
    container_name: youtude-api
    environment:
      DATABASE_URL: postgresql+asyncpg://youtude:youtude@youtude-postgres:5432/youtude
      # Для браузера ссылка должна вести на localhost:9000
      S3_ENDPOINT: http://localhost:9000
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret-key-change-me}
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: videos
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata: