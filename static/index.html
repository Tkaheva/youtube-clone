<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>YouTude Clone</title>
    <style>
        body { background-color: #0f0f0f; color: white; font-family: 'Roboto', sans-serif; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: bold; display: flex; align-items: center; gap: 5px; cursor: pointer; color: white; text-decoration: none;}
        .logo span { color: #ff0000; }
        .login-form { display: flex; gap: 10px; }
        input[type="email"], input[type="password"] { padding: 8px; background: #1f1f1f; border: 1px solid #333; color: white; border-radius: 4px; }
        button { padding: 8px 16px; background: #ff0000; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        button:hover { background: #cc0000; }
        button.secondary { background: #272727; color: white; }
        button.secondary:hover { background: #3f3f3f; }
        
        /* Сетка видео */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .video-card { cursor: pointer; }
        .thumbnail { width: 100%; height: 170px; background: #222; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #555; }
        .video-info { display: flex; gap: 10px; margin-top: 10px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #555; flex-shrink: 0; }
        .video-title { font-weight: 500; font-size: 16px; margin: 0; }
        .author { color: #aaa; font-size: 14px; margin-top: 5px; }

        /* Модальное окно (Плеер) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; overflow-y: auto; }
        .modal-content { background: #0f0f0f; max-width: 1100px; margin: 40px auto; padding: 20px; border-radius: 12px; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 20px; background: #333; font-size: 20px; padding: 5px 15px; border-radius: 50%; }
        .player-area { width: 100%; height: 500px; background: #000; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; overflow: hidden; }
        
        /* Заголовок и описание (как в ТЗ) */
        .video-header { margin-bottom: 20px; }
        .video-header h1 { font-size: 22px; margin: 0 0 10px 0; }
        .video-description { background: #272727; padding: 15px; border-radius: 12px; font-size: 14px; line-height: 1.5; margin-top: 15px; }
        .video-description b { display: block; margin-bottom: 5px; }
        
        /* Кнопки действий */
        .video-actions { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .action-btn { background: #272727; padding: 8px 16px; border-radius: 20px; font-size: 15px; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;}
        .action-btn:hover { background: #3f3f3f; }
        .action-btn.active { color: #ff0000; }

        /* Комментарии */
        .comments-section { margin-top: 20px; }
        .comment-input { width: 100%; padding: 10px; background: #1f1f1f; border: 1px solid #333; color: white; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; resize: vertical; }
        .comment { display: flex; gap: 10px; margin-bottom: 15px; }
        .comment-body { background: #1f1f1f; padding: 10px; border-radius: 8px; width: 100%; }
        .comment-author { font-weight: bold; font-size: 14px; margin-bottom: 5px; color: #ddd;}
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">▶ <span>YouTude</span></div>
        <div id="authBlock" class="login-form">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Пароль">
            <button onclick="login()">Войти</button>
        </div>
        <div id="userInfo" style="display:none;">
            <span style="margin-right: 10px;">Вы вошли!</span>
            <button class="secondary" onclick="logout()">Выйти</button>
        </div>
    </div>

    <h2>Главная лента</h2>
    <div class="video-grid" id="videoGrid"></div>

    <!-- Модальное окно просмотра видео -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">X</button>
            
            <!-- Плеер -->
            <div class="player-area" id="modalPlayer">
                <span style="color:#888;">Загрузка видео...</span>
            </div>
            
            <!-- Заголовок и описание -->
            <div class="video-header">
                <h1 id="modalTitle">Название видео</h1>
                <div class="author" id="modalAuthor">Автор</div>
                
                <div class="video-description">
                    <b>Описание</b>
                    <span id="modalDescription">Описание видео...</span>
                </div>
            </div>
            
            <!-- Кнопки действий (Лайки/Дизлайки) -->
            <div class="video-actions">
                <div class="action-btn" onclick="likeVideo('like')" id="likeBtn">👍 <span id="likeCount">0</span></div>
                <div class="action-btn" onclick="likeVideo('dislike')" id="dislikeBtn">👎 <span id="dislikeCount">0</span></div>
            </div>

            <!-- Комментарии -->
            <div class="comments-section">
                <h3>Комментарии <span id="commentCount">0</span></h3>
                <textarea id="newComment" class="comment-input" rows="2" placeholder="Написать комментарий..."></textarea>
                <button onclick="addComment()" style="margin-bottom: 20px;">Отправить</button>
                <div id="commentsList"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '';
        let currentVideoId = null;

        // --- Авторизация ---
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const formData = new URLSearchParams();
            formData.append('username', email);
            formData.append('password', password);

            const res = await fetch(`${API_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('token', data.access_token);
                document.getElementById('authBlock').style.display = 'none';
                document.getElementById('userInfo').style.display = 'block';
                alert('Успешный вход!');
            } else {
                alert('Ошибка входа. Проверьте логин/пароль.');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            document.getElementById('authBlock').style.display = 'flex';
            document.getElementById('userInfo').style.display = 'none';
        }

        // --- Лента видео ---
        async function loadVideos() {
            try {
                const res = await fetch(`${API_URL}/videos`);
                const data = await res.json();
                const videos = data.videos || data; 
                const grid = document.getElementById('videoGrid');
                grid.innerHTML = '';
                
                if (!videos || videos.length === 0) {
                    grid.innerHTML = '<p>Видео пока нет.</p>';
                    return;
                }

                videos.forEach(video => {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <div class="thumbnail">▶</div>
                        <div class="video-info">
                            <div class="avatar"></div>
                            <div>
                                <h3 class="video-title">${video.title}</h3>
                                <div class="author">${video.author_username || 'Автор'}</div>
                            </div>
                        </div>
                    `;
                    // Передаем title и описание (если есть) в модалку
                    card.onclick = () => openVideo(video.id, video.title, video.description, video.author_username);
                    grid.appendChild(card);
                });
            } catch (e) {
                console.error(e);
            }
        }

        // --- Просмотр видео (Модалка) ---
        async function openVideo(id, title, description, author) {
            currentVideoId = id;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalAuthor').innerText = `Автор: ${author || 'Неизвестен'}`;
            document.getElementById('modalDescription').innerText = description || 'Описание отсутствует.';
            document.getElementById('videoModal').style.display = 'block';
            document.getElementById('commentsList').innerHTML = '<p>Загрузка комментариев...</p>';
            
            // Сбрасываем счетчики
            document.getElementById('likeCount').innerText = '0';
            document.getElementById('dislikeCount').innerText = '0';
            
            // 1. Получаем ссылку на видео (stream)
            try {
                const res = await fetch(`${API_URL}/videos/${id}/stream`);
                if (res.ok) {
                    const data = await res.json();
                    // Браузеры могут не поддерживать некоторые форматы, но тег video мы вставим
                    document.getElementById('modalPlayer').innerHTML = `
                        <video controls style="width:100%; height:100%;" autoplay>
                            <source src="${data.url || data.stream_url}" type="video/mp4">
                            Ваш браузер не поддерживает видео.
                        </video>
                    `;
                } else {
                    document.getElementById('modalPlayer').innerHTML = `<span style="color:red">Видео недоступно (возможно, формат не mp4 или скрыто модератором)</span>`;
                }
            } catch (e) {
                document.getElementById('modalPlayer').innerHTML = `<span style="color:red">Ошибка загрузки видео</span>`;
            }

            // 2. Загружаем комментарии
            loadComments(id);
            
            // 3. Заглушка для лайков (так как бэкенд не отдает их в списке)
            document.getElementById('likeCount').innerText = '124';
            document.getElementById('dislikeCount').innerText = '3';
        }

        function closeModal() {
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('modalPlayer').innerHTML = ''; // Останавливаем плеер
        }

        // --- Комментарии (Live-обновление) ---
        async function loadComments(videoId) {
            try {
                const res = await fetch(`${API_URL}/videos/${videoId}/comments`);
                const data = await res.json();
                
                // Адаптируемся под формат бэкенда (массив или объект)
                const comments = Array.isArray(data) ? data : (data.comments || data.items || []);
                
                const list = document.getElementById('commentsList');
                list.innerHTML = '';
                
                document.getElementById('commentCount').innerText = comments.length;

                if (comments.length === 0) {
                    list.innerHTML = '<p style="color:#aaa;">Комментариев пока нет.</p>';
                    return;
                }

                comments.forEach(c => {
                    list.innerHTML += `
                        <div class="comment">
                            <div class="avatar" style="width:32px; height:32px;"></div>
                            <div class="comment-body">
                                <div class="comment-author">${c.author_username || c.user?.username || 'Пользователь'}</div>
                                <div>${c.content || c.text}</div>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Ошибка загрузки комментариев:", e);
            }
        }

        async function addComment() {
            const token = localStorage.getItem('token');
            if (!token) return alert('Войдите, чтобы оставить комментарий!');
            
            const content = document.getElementById('newComment').value;
            if (!content) return;

            const res = await fetch(`${API_URL}/videos/${currentVideoId}/comments`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify({ content: content })
            });

            if (res.ok) {
                document.getElementById('newComment').value = '';
                // Live-обновление: сразу перезапрашиваем список, чтобы новый коммент появился
                loadComments(currentVideoId); 
            } else {
                alert('Ошибка отправки комментария');
            }
        }

        // --- Лайки и Дизлайки ---
        async function likeVideo(type) {
            const token = localStorage.getItem('token');
            if (!token) return alert('Войдите, чтобы оценить видео!');

            // Бэкенд Cline поддерживает только лайки через POST /videos/{id}/like
            if (type === 'like') {
                const res = await fetch(`${API_URL}/videos/${currentVideoId}/like`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const count = document.getElementById('likeCount');
                    count.innerText = parseInt(count.innerText) + 1;
                }
            } else {
                // Дизлайки бэкенд пока не поддерживает, делаем визуальную имитацию
                const count = document.getElementById('dislikeCount');
                count.innerText = parseInt(count.innerText) + 1;
            }
        }

        // Инициализация
        if (localStorage.getItem('token')) {
            document.getElementById('authBlock').style.display = 'none';
            document.getElementById('userInfo').style.display = 'block';
        }
        loadVideos();
    </script>
</body>
</html>
