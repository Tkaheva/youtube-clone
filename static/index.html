<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>YouTude Clone</title>
    <style>
        body { background-color: #0f0f0f; color: white; font-family: 'Roboto', sans-serif; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .logo span { color: #ff0000; }
        .search-bar { background: #121212; border: 1px solid #333; padding: 8px; border-radius: 20px; width: 300px; color: white; }
        .login-form { display: flex; gap: 10px; }
        input[type="email"], input[type="password"] { padding: 8px; background: #1f1f1f; border: 1px solid #333; color: white; border-radius: 4px; }
        button { padding: 8px 16px; background: #ff0000; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        button:hover { background: #cc0000; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .video-card { cursor: pointer; }
        .thumbnail { width: 100%; height: 170px; background: #333; border-radius: 12px; object-fit: cover; }
        .video-info { display: flex; gap: 10px; margin-top: 10px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #555; }
        .video-title { font-weight: 500; font-size: 16px; margin: 0; }
        .author { color: #aaa; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">▶ <span>YouTude</span></div>
        <input type="text" class="search-bar" placeholder="Поиск видео...">
        <div id="authBlock" class="login-form">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Пароль">
            <button onclick="login()">Войти</button>
        </div>
        <div id="userInfo" style="display:none;">
            <span style="margin-right: 10px;">Вы вошли!</span>
            <button onclick="logout()" style="background: #333;">Выйти</button>
        </div>
    </div>

    <h2>Главная лента</h2>
    <div class="video-grid" id="videoGrid"></div>

    <script>
        // Используем относительные пути, так как фронт и API на одном порту
        const API_URL = ''; 

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // OAuth2 требует form-data
            const formData = new URLSearchParams();
            formData.append('username', email);
            formData.append('password', password);

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('token', data.access_token);
                    document.getElementById('authBlock').style.display = 'none';
                    document.getElementById('userInfo').style.display = 'block';
                    alert('Успешный вход!');
                } else {
                    alert('Ошибка входа. Проверьте логин/пароль.');
                }
            } catch (e) {
                alert('Ошибка сети: ' + e.message);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            document.getElementById('authBlock').style.display = 'flex';
            document.getElementById('userInfo').style.display = 'none';
        }

        async function loadVideos() {
            try {
                const res = await fetch(`${API_URL}/videos`);
                const data = await res.json();
                const grid = document.getElementById('videoGrid');
                grid.innerHTML = '';
                
                const videos = data.videos || data; 

                if (!videos || videos.length === 0) {
                    grid.innerHTML = '<p>Видео пока нет. Загрузите первое через Swagger!</p>';
                    return;
                }

                videos.forEach(video => {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <img src="https://via.placeholder.com/300x170/222/fff?text=Video" class="thumbnail" alt="preview">
                        <div class="video-info">
                            <div class="avatar"></div>
                            <div>
                                <h3 class="video-title">${video.title}</h3>
                                <div class="author">${video.author_username || 'Неизвестный автор'}</div>
                            </div>
                        </div>
                    `;
                    card.onclick = () => alert(`Вы кликнули на видео: ${video.title}`);
                    grid.appendChild(card);
                });
            } catch (e) {
                console.error("Ошибка загрузки видео:", e);
            }
        }

        if (localStorage.getItem('token')) {
            document.getElementById('authBlock').style.display = 'none';
            document.getElementById('userInfo').style.display = 'block';
        }
        loadVideos();
    </script>
</body>
</html>
