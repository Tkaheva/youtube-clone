<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTude Clone</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-color: #f1f1f1;
            --text-secondary: #aaaaaa;
            --border-color: #3f3f3f;
            --hover-bg: #272727;
            --accent-color: #ff0000;
            --profile-color: #1ea77d;
        }

        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Roboto', Arial, sans-serif; margin: 0; padding: 0; }

        /* --- Верхняя панель --- */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; position: sticky; top: 0; background-color: var(--bg-color); z-index: 100; }
        .logo-area { display: flex; align-items: center; gap: 5px; font-size: 20px; font-weight: bold; cursor: pointer; }
        .logo-icon { color: var(--accent-color); font-size: 24px; }
        .icons-area { display: flex; gap: 15px; align-items: center; font-size: 20px; }
        
        /* Поиск */
        .search-container { display: none; align-items: center; gap: 5px; background: #1f1f1f; padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border-color); }
        .search-container input { background: transparent; border: none; color: white; outline: none; font-size: 14px; width: 200px; }
        .search-container button { background: var(--hover-bg); border: none; color: white; padding: 4px 8px; border-radius: 10px; cursor: pointer; }

        /* --- Вкладки --- */
        .tabs-container { display: flex; gap: 12px; padding: 0 16px 12px 16px; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid var(--border-color); }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab { background-color: var(--hover-bg); color: var(--text-color); padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .tab.active { background-color: var(--text-color); color: var(--bg-color); }

        /* --- Сетка видео --- */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; padding: 16px; }
        .video-card { cursor: pointer; border-radius: 12px; overflow: hidden; }
        .thumbnail { width: 100%; aspect-ratio: 16 / 9; background: #222; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #555; position: relative; }
        .thumbnail::after { content: '▶'; position: absolute; opacity: 0.5; }
        .video-info { display: flex; gap: 12px; margin-top: 12px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #555; flex-shrink: 0; }
        .video-details { flex-grow: 1; }
        .video-title { font-weight: 500; font-size: 16px; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .author { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }

        /* --- Профиль --- */
        .profile-page { display: none; padding: 20px; max-width: 800px; margin: 0 auto; }
        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--profile-color); color: white; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; }
        .profile-name { font-size: 24px; font-weight: bold; margin: 0; }
        .profile-btn { background: var(--text-color); color: var(--bg-color); padding: 10px 20px; border-radius: 20px; font-weight: bold; border: none; cursor: pointer; width: 100%; font-size: 16px; margin-bottom: 20px;}
        .profile-section { margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 20px;}
        .profile-section h2 { font-size: 20px; margin-bottom: 15px; }
        
        /* История просмотров */
        .history-container { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
        .history-card { min-width: 220px; cursor: pointer; }
        .history-thumbnail { width: 220px; height: 124px; background: #333; border-radius: 8px; position: relative; }
        .history-title { font-size: 14px; margin-top: 8px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .history-author { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

        /* --- Модальное окно --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; overflow-y: auto; }
        .modal-content { background: var(--bg-color); max-width: 1100px; margin: 40px auto; padding: 20px; border-radius: 12px; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 20px; background: var(--hover-bg); font-size: 20px; padding: 5px 15px; border-radius: 50%; color: white; border: none; cursor: pointer;}
        .player-area { width: 100%; height: 500px; background: #000; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; overflow: hidden; }
        
        .video-header { margin-bottom: 20px; }
        .video-header h1 { font-size: 22px; margin: 0 0 10px 0; }
        .video-description { background: var(--hover-bg); padding: 15px; border-radius: 12px; font-size: 14px; line-height: 1.5; margin-top: 15px; }
        .video-actions { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .action-btn { background: var(--hover-bg); padding: 8px 16px; border-radius: 20px; font-size: 15px; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;}
        .action-btn:hover { background: #3f3f3f; }

        .comments-section { margin-top: 20px; }
        .comment-input { width: 100%; padding: 10px; background: #1f1f1f; border: 1px solid var(--border-color); color: white; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; resize: vertical; }
        .comment { display: flex; gap: 10px; margin-bottom: 15px; position: relative; padding-right: 60px; }
        .comment-body { background: var(--hover-bg); padding: 10px; border-radius: 8px; width: 100%; }
        .comment-author { font-weight: bold; font-size: 14px; margin-bottom: 5px; color: #ddd;}
        .comment-controls { position: absolute; right: 0; top: 5px; display: flex; gap: 5px; opacity: 0; transition: opacity 0.2s; }
        .comment:hover .comment-controls { opacity: 1; }
        .comment-controls button { background: var(--hover-bg); border: none; color: var(--text-secondary); cursor: pointer; padding: 5px; border-radius: 4px; font-size: 12px;}
        .comment-controls button:hover { color: white; }

        /* --- Авторизация --- */
        .auth-box { display: flex; gap: 10px; align-items: center; }
        .auth-box input { padding: 6px; background: #1f1f1f; border: 1px solid var(--border-color); color: white; border-radius: 4px; width: 120px; font-size: 12px;}
        .auth-box button { padding: 6px 12px; background: var(--accent-color); color: white; border: none; border-radius: 16px; cursor: pointer; font-weight: bold; font-size: 12px;}
    </style>
</head>
<body>
    <!-- Верхняя панель -->
    <div class="top-bar">
        <div class="logo-area" onclick="showPage('home')">
            <span class="logo-icon">▶</span> YouTude
        </div>
        
        <div id="searchContainer" class="search-container">
            <input type="text" id="searchInput" placeholder="Поиск..." oninput="filterVideos()">
            <button onclick="toggleSearch()">X</button>
        </div>

        <div class="icons-area">
            <div id="authBlock" class="auth-box">
                <input type="email" id="email" placeholder="Email">
                <input type="password" id="password" placeholder="Пароль">
                <button onclick="login()">Войти</button>
            </div>
            <div id="userInfo" style="display:none;">
                <div id="avatarBtn" onclick="openProfile()" style="width: 32px; height: 32px; border-radius: 50%; background: var(--profile-color); display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; color: white;">А</div>
                <button onclick="logout()" style="background: var(--hover-bg); border-radius: 50%; padding: 5px 10px; border: none; color: white; cursor: pointer; margin-left: 10px;">Выйти</button>
            </div>
            <span id="notifyIcon" style="cursor:pointer;" title="Уведомления" onclick="alert('У вас 0 новых уведомлений!')">🔔</span>
            <span id="searchIcon" style="cursor:pointer;" title="Поиск" onclick="toggleSearch()">🔍</span>
        </div>
    </div>

    <!-- Главная страница -->
    <div id="homePage">
        <div class="tabs-container">
            <div class="tab active" onclick="switchTab(this)">Главная</div>
            <div class="tab" onclick="switchTab(this)">Подписки</div>
            <div class="tab" onclick="switchTab(this)">Музыка</div>
            <div class="tab" onclick="switchTab(this)">Сейчас в тренде</div>
        </div>
        <div class="video-grid" id="videoGrid"></div>
    </div>

    <!-- Личный кабинет -->
    <div id="profilePage" class="profile-page">
        <div class="profile-header">
            <div class="profile-avatar">А</div>
            <div>
                <h1 class="profile-name">Анастасия Ткачёва</h1>
                <div style="color: var(--text-secondary);">@anastasia</div>
            </div>
        </div>
        <button class="profile-btn" onclick="alert('Функция создания канала в разработке!')">Создать канал</button>
        
        <div class="profile-section">
            <h2>История просмотров</h2>
            <div class="history-container" id="historyContainer">
                <!-- Сюда будут загружаться просмотренные видео -->
                <p style="color: var(--text-secondary); font-size: 14px;">Вы пока ничего не смотрели.</p>
            </div>
        </div>

        <div class="profile-section">
            <h2>Библиотека</h2>
            <div style="display: flex; gap: 10px;">
                <div class="tab active" style="padding: 10px 20px;">Недавние</div>
                <div class="tab" style="padding: 10px 20px;">Плейлисты</div>
            </div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">X</button>
            
            <div class="player-area" id="modalPlayer">
                <span style="color:#888;">Загрузка видео...</span>
            </div>
            
            <div class="video-header">
                <h1 id="modalTitle">Название видео</h1>
                <div class="author" id="modalAuthor">Автор</div>
                
                <div class="video-actions">
                    <div class="action-btn" onclick="likeVideo('like')" id="likeBtn">👍 <span id="likeCount">0</span></div>
                    <div class="action-btn" onclick="likeVideo('dislike')" id="dislikeBtn">👎 <span id="dislikeCount">0</span></div>
                </div>

                <div class="video-description">
                    <b>Описание</b>
                    <span id="modalDescription">Описание видео...</span>
                </div>
            </div>

            <div class="comments-section">
                <h3>Комментарии <span id="commentCount">0</span></h3>
                <textarea id="newComment" class="comment-input" rows="2" placeholder="Написать комментарий..."></textarea>
                <button onclick="addComment()" style="margin-bottom: 20px; padding: 10px 20px; background: var(--accent-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">Отправить</button>
                <div id="commentsList"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '';
        let currentVideoId = null;
        let allVideos = []; 
        let historyIds = JSON.parse(localStorage.getItem('history') || '[]'); // Загружаем историю

        // --- Поиск ---
        function toggleSearch() {
            const container = document.getElementById('searchContainer');
            if (container.style.display === 'none' || container.style.display === '') {
                container.style.display = 'flex';
                document.getElementById('searchInput').focus();
            } else {
                container.style.display = 'none';
                document.getElementById('searchInput').value = '';
                renderVideos(allVideos);
            }
        }

        function filterVideos() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allVideos.filter(v => v.title.toLowerCase().includes(query));
            renderVideos(filtered);
        }

        // --- Навигация и Профиль ---
        function showPage(page) {
            if (page === 'home') {
                document.getElementById('homePage').style.display = 'block';
                document.getElementById('profilePage').style.display = 'none';
            } else if (page === 'profile') {
                document.getElementById('homePage').style.display = 'none';
                document.getElementById('profilePage').style.display = 'block';
            }
        }

        function openProfile() {
            showPage('profile');
            renderHistory(); // Обновляем историю при открытии профиля
        }

        function switchTab(element) {
            document.querySelectorAll('.tabs-container .tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
        }

        // --- История просмотров ---
        function addToHistory(videoId) {
            // Удаляем из истории, если уже там есть (чтобы переместить в начало)
            historyIds = historyIds.filter(id => id !== videoId);
            // Добавляем в начало
            historyIds.unshift(videoId);
            // Оставляем только последние 10 видео
            if (historyIds.length > 10) historyIds.pop();
            
            localStorage.setItem('history', JSON.stringify(historyIds));
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            container.innerHTML = '';

            // Находим полные данные видео по сохраненным ID
            const historyVideos = historyIds.map(id => allVideos.find(v => v.id === id)).filter(v => v);

            if (historyVideos.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary); font-size: 14px;">Вы пока ничего не смотрели.</p>';
                return;
            }

            historyVideos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <div class="history-thumbnail"></div>
                    <div class="history-title">${video.title}</div>
                    <div class="history-author">${video.author_username || 'Автор'}</div>
                `;
                card.onclick = () => openVideo(video.id, video.title, video.description, video.author_username);
                container.appendChild(card);
            });
        }

        // --- Авторизация ---
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const formData = new URLSearchParams();
            formData.append('username', email);
            formData.append('password', password);

            const res = await fetch(`${API_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('token', data.access_token);
                document.getElementById('authBlock').style.display = 'none';
                document.getElementById('userInfo').style.display = 'flex';
            } else {
                alert('Ошибка входа.');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('history'); // Очищаем историю при выходе
            historyIds = [];
            document.getElementById('authBlock').style.display = 'flex';
            document.getElementById('userInfo').style.display = 'none';
            showPage('home');
        }

        // --- Видео ---
        async function loadVideos() {
            try {
                const res = await fetch(`${API_URL}/videos`);
                const data = await res.json();
                allVideos = data.videos || data; 
                renderVideos(allVideos);
            } catch (e) {
                console.error(e);
            }
        }

        function renderVideos(videos) {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';
            
            if (!videos || videos.length === 0) {
                grid.innerHTML = '<p style="padding: 20px;">Видео пока нет.</p>';
                return;
            }

            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="thumbnail"></div>
                    <div class="video-info">
                        <div class="avatar"></div>
                        <div class="video-details">
                            <h3 class="video-title">${video.title}</h3>
                            <div class="author">${video.author_username || 'Автор'}</div>
                        </div>
                    </div>
                `;
                card.onclick = () => openVideo(video.id, video.title, video.description, video.author_username);
                grid.appendChild(card);
            });
        }

        // --- Просмотр видео ---
        async function openVideo(id, title, description, author) {
            currentVideoId = id;
            addToHistory(id); // Сохраняем в историю!
            
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalAuthor').innerText = `Автор: ${author || 'Неизвестен'}`;
            document.getElementById('modalDescription').innerText = description || 'Описание отсутствует.';
            document.getElementById('videoModal').style.display = 'block';
            
            try {
                const res = await fetch(`${API_URL}/videos/${id}/stream`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('modalPlayer').innerHTML = `
                        <video controls style="width:100%; height:100%;" autoplay>
                            <source src="${data.url || data.stream_url}" type="video/mp4">
                        </video>
                    `;
                } else {
                    document.getElementById('modalPlayer').innerHTML = `<span style="color:red">Видео недоступно</span>`;
                }
            } catch (e) {
                document.getElementById('modalPlayer').innerHTML = `<span style="color:red">Ошибка загрузки</span>`;
            }

            loadComments(id);
        }

        function closeModal() {
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('modalPlayer').innerHTML = ''; 
        }

        // --- Комментарии ---
        let localComments = []; 

        async function loadComments(videoId) {
            try {
                const res = await fetch(`${API_URL}/videos/${videoId}/comments`);
                const data = await res.json();
                localComments = Array.isArray(data) ? data : (data.comments || data.items || []);
                renderComments();
            } catch (e) {
                console.error("Ошибка загрузки комментариев:", e);
            }
        }

        function renderComments() {
            const list = document.getElementById('commentsList');
            const token = localStorage.getItem('token');
            list.innerHTML = '';
            document.getElementById('commentCount').innerText = localComments.length;

            if (localComments.length === 0) {
                list.innerHTML = '<p style="color:#aaa;">Комментариев пока нет.</p>';
                return;
            }

            localComments.forEach((c, index) => {
                const controls = token ? `
                    <div class="comment-controls">
                        <button onclick="editComment(${index})" title="Редактировать">✏️</button>
                        <button onclick="deleteComment(${index})" title="Удалить">🗑️</button>
                    </div>
                ` : '';

                list.innerHTML += `
                    <div class="comment">
                        <div class="avatar" style="width:32px; height:32px;"></div>
                        <div class="comment-body">
                            ${controls}
                            <div class="comment-author">${c.author_username || c.user?.username || 'Пользователь'}</div>
                            <div id="comment-text-${index}">${c.content || c.text}</div>
                        </div>
                    </div>
                `;
            });
        }

        async function addComment() {
            const token = localStorage.getItem('token');
            if (!token) return alert('Войдите, чтобы оставить комментарий!');
            
            const content = document.getElementById('newComment').value;
            if (!content) return;

            const res = await fetch(`${API_URL}/videos/${currentVideoId}/comments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ content: content })
            });

            if (res.ok) {
                document.getElementById('newComment').value = '';
                loadComments(currentVideoId); 
            } else {
                alert('Ошибка отправки');
            }
        }

        function deleteComment(index) {
            if (confirm('Удалить этот комментарий?')) {
                localComments.splice(index, 1);
                renderComments();
            }
        }

        function editComment(index) {
            const textDiv = document.getElementById(`comment-text-${index}`);
            const currentText = textDiv.innerText;
            const newText = prompt('Редактировать комментарий:', currentText);
            
            if (newText !== null && newText.trim() !== '') {
                textDiv.innerText = newText;
                localComments[index].content = newText;
            }
        }

        // --- Лайки ---
        async function likeVideo(type) {
            const token = localStorage.getItem('token');
            if (!token) return alert('Войдите, чтобы оценить видео!');

            if (type === 'like') {
                const res = await fetch(`${API_URL}/videos/${currentVideoId}/like`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const count = document.getElementById('likeCount');
                    count.innerText = parseInt(count.innerText) + 1;
                }
            } else {
                const count = document.getElementById('dislikeCount');
                count.innerText = parseInt(count.innerText) + 1;
            }
        }

        // Инициализация
        if (localStorage.getItem('token')) {
            document.getElementById('authBlock').style.display = 'none';
            document.getElementById('userInfo').style.display = 'flex';
        }
        loadVideos();
    </script>
</body>
</html>
